<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>TA 영업현황 지도 — 공개 시연용</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- API 키가 필요 없는 OpenFreeMap 벡터 지도용 MapLibre / Leaflet 어댑터 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"/>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.1/leaflet-maplibre-gl.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;}
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;min-height:44px;}
#title{font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap;}
#branch-btns{display:flex;gap:3px;flex-wrap:wrap;}
.branch-btn{padding:3px 9px;font-size:11px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;transition:all .15s;}
.branch-btn:hover{background:#e8f4fd;}
.branch-btn.active{background:#1a7fd4;color:#fff;border-color:#1a7fd4;}
#kpi-bar{font-size:11px;color:#555;margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.kpi-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px;}
#ta-list-btn{padding:3px 10px;font-size:11px;border-radius:4px;cursor:pointer;border:1px solid #1a7fd4;background:#fff;color:#1a7fd4;white-space:nowrap;}
#ta-list-btn.active{background:#1a7fd4;color:#fff;}
#main{display:flex;flex:1;overflow:hidden;position:relative;}
#map{width:100%;height:100%;}
#right-panel{width:0;overflow:hidden;transition:width .28s;background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0;}
#right-panel.open{width:400px;}
#panel-hd{padding:10px 12px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#panel-title{font-size:13px;font-weight:700;}
#panel-close{background:none;border:none;font-size:18px;cursor:pointer;color:#888;padding:2px 6px;}
#panel-body{flex:1;overflow-y:auto;padding:12px;}
.detail-row{display:flex;gap:6px;margin-bottom:4px;}
.detail-row .lbl{font-size:11px;color:#aaa;min-width:72px;padding-top:1px;}
.detail-row .val{font-size:12px;color:#1a1a1a;flex:1;line-height:1.4;}
.status-badge{display:inline-block;padding:2px 8px;border-radius:12px;color:#fff;font-size:11px;font-weight:600;margin-bottom:8px;}
.text-box{background:#f8f9fa;border-radius:5px;padding:7px 9px;font-size:11px;color:#444;line-height:1.6;max-height:90px;overflow-y:auto;white-space:pre-wrap;}
hr.dv{border:none;border-top:1px solid #eee;margin:8px 0;}
.sec-lbl{font-size:10px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.ta-filter-row{padding:7px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #eee;flex-shrink:0;}
.ta-filter-row input,.ta-filter-row select{font-size:11px;padding:3px 7px;border:1px solid #ddd;border-radius:4px;background:#fff;}
.ta-kpi{padding:5px 9px;background:#f8f9fa;font-size:11px;color:#555;display:flex;gap:10px;flex-shrink:0;border-bottom:1px solid #eee;}
#ta-tbl-wrap{flex:1;overflow:auto;}
#ta-tbl{width:100%;border-collapse:collapse;font-size:11px;}
#ta-tbl th{background:#f0f4f8;padding:5px 7px;text-align:left;border-bottom:2px solid #ddd;position:sticky;top:0;z-index:1;white-space:nowrap;cursor:pointer;user-select:none;}
#ta-tbl th:hover{background:#e0e8f0;}
#ta-tbl td{padding:4px 7px;border-bottom:1px solid #f0f0f0;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
#ta-tbl tr:hover{background:#f8f9fa;cursor:pointer;}
.dl-btn{display:block;width:calc(100% - 14px);margin:7px;padding:6px;background:#28a745;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;}
.legend-box{background:rgba(255,255,255,0.95);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.15);padding:7px 10px;font-size:11px;}
.legend-item{display:flex;align-items:center;gap:5px;margin-bottom:2px;}

.demo-label{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap;}
.demo-watermark{position:absolute;z-index:850;bottom:18px;left:14px;background:rgba(255,255,255,.94);padding:9px 12px;border-radius:7px;box-shadow:0 2px 8px #0002;font-size:11px;color:#334155;pointer-events:none;max-width:370px;}
@media(max-width:750px){#right-panel.open{position:absolute;right:0;top:0;bottom:0;width:min(96%,400px);z-index:1100;box-shadow:-3px 0 14px #0002}#title{font-size:13px}#topbar{gap:6px}#kpi-bar{margin-left:0;gap:7px}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="title">📦 TA 영업현황 지도</span><span class="demo-label">공개 시연용 · 가상 데이터</span>
    <div id="branch-btns"><button class="branch-btn active" onclick="selectBranch(null)">전체</button></div>
    <button id="ta-list-btn" onclick="toggleList()">📋 전체현황</button>
    <div id="kpi-bar">
      <span id="k-total">TA 0건</span>
      <span id="k-geo">지도 0건</span>
      <span id="k-vol">물량 0건</span>
      <span><span class="kpi-dot" style="background:#28a745"></span><span id="k-c0">확정 0</span></span>
      <span><span class="kpi-dot" style="background:#1a7fd4"></span><span id="k-c1">유력 0</span></span>
      <span><span class="kpi-dot" style="background:#fd7e14"></span><span id="k-c2">협상 0</span></span>
      <span><span class="kpi-dot" style="background:#6c757d"></span><span id="k-c3">제안 0</span></span>
    </div>
  </div>
  <div id="main">
    <div id="map"></div><div class="demo-watermark"><b>공개용 데모</b> — 표시된 고객사, 위치, 물량, 판가, 담당자 등 모든 데이터는 가상 예시입니다.</div>
    <div id="right-panel">
      <div id="panel-hd"><span id="panel-title">상세정보</span><button id="panel-close" onclick="closePanel()">✕</button></div>
      <div id="panel-body"></div>
    </div>
  </div>
</div>

    el.textContent='지도 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 회사 보안망에서 jsdelivr.net 접속 가능 여부를 확인해주세요.';
    return el;
  };
  warning.addTo(map);
}
map.attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | <a href="https://openfreemap.org/">OpenFreeMap</a>');
const mkLayer = L.layerGroup().addTo(map);

const leg = L.control({position:'bottomright'});
leg.onAdd = () => {
  const d = L.DomUtil.create('div','legend-box');
  d.innerHTML = '<b style="display:block;margin-bottom:5px;color:#444;">🚚 택배사</b>' +
    Object.keys(CARRIER_COL).map(c=>{
      const logo=LOGOS[c]||'';
      const img=logo?`<img src="${logo}" style="width:20px;height:20px;object-fit:contain;">`:`<span style="width:12px;height:12px;background:${CARRIER_COL[c]};border-radius:2px;display:inline-block;"></span>`;
      return `<div class="legend-item">${img}<span>${c}</span></div>`;
    }).join('');
  return d;
};
leg.addTo(map);

function makeIcon(carrier, name, sel){
  const sz=sel?44:36, logo=LOGOS[carrier]||LOGOS['기타']||'';
  const glow=sel?'filter:drop-shadow(0 0 5px rgba(26,125,212,0.8));':'filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2));';
  const img=logo?`<img src="${logo}" width="${sz}" height="${sz}" style="object-fit:contain;${glow}display:block;">`:`<svg width="${sz}" height="${sz}" viewBox="0 0 40 40"><rect x="2" y="2" width="36" height="36" rx="8" fill="${CARRIER_COL[carrier]||'#6c757d'}" opacity="0.9"/><text x="20" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="Arial">${carrier.slice(0,2)}</text></svg>`;
  const html=`<div style="display:flex;flex-direction:column;align-items:center;">${img}<div style="font-size:10px;font-weight:600;color:#111;white-space:nowrap;margin-top:1px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;">${name}</div></div>`;
  return L.divIcon({html,iconSize:[sz,sz+14],iconAnchor:[sz/2,sz/2],className:''});
}

function renderMarkers(){
  mkLayer.clearLayers();
  filteredData.forEach(d=>{
    if(!d.lat||!d.lng) return;
    const sel=d.고객명===selectedCust;
    const m=L.marker([d.lat,d.lng],{icon:makeIcon(d.현택배사,d.고객명,sel),zIndexOffset:sel?1000:0});
    m.bindTooltip(`<b>${d.고객명}</b><br>${d.관할지사} | ${d.현택배사}<br>예상 ${(d.예상월물량||0).toLocaleString()}건`,{direction:'top',offset:[0,-10]});
    m.on('click',()=>openDetail(d));
    m.addTo(mkLayer);
  });
}

// ── 지사 버튼 ──
function initBranches(){
  const brs=[...new Set(ALL_DATA.map(d=>d.관할지사))].sort();
  const wrap=document.getElementById('branch-btns');
  wrap.innerHTML='<button class="branch-btn active" onclick="selectBranch(null)">전체</button>';
  brs.forEach(br=>{
    const b=document.createElement('button');
    b.className='branch-btn';b.textContent=br;b.onclick=()=>selectBranch(br);wrap.appendChild(b);
  });
}
function selectBranch(br){
  currentBranch=br;
  document.querySelectorAll('.branch-btn').forEach(b=>b.classList.toggle('active',b.textContent===(br||'전체')));
  applyFilter();
  if(br){
    const pts=filteredData.filter(d=>d.lat&&d.lng).map(d=>[d.lat,d.lng]);
    if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:14,animate:true});
    else if(pts.length===1) map.setView(pts[0],13,{animate:true});
    else map.setView([37.41,127.25],10,{animate:true});
  }
  if(panelMode==='list') renderList();
}
function applyFilter(){
  filteredData=currentBranch?ALL_DATA.filter(d=>d.관할지사===currentBranch):[...ALL_DATA];
  renderMarkers(); updateKPI(); if(panelMode==='list') renderList();
}
function updateKPI(){
  const geo=filteredData.filter(d=>d.lat&&d.lng).length;
  const vol=filteredData.reduce((s,d)=>s+(d.예상월물량||0),0);
  const c=s=>filteredData.filter(d=>d.진행현황===s).length;
  document.getElementById('k-total').textContent=`TA ${filteredData.length}건`;
  document.getElementById('k-geo').textContent=`지도 ${geo}건`;
  document.getElementById('k-vol').textContent=`물량 ${vol.toLocaleString()}건`;
  document.getElementById('k-c0').textContent=`확정 ${c('확정')}`;
  document.getElementById('k-c1').textContent=`유력 ${c('유력')}`;
  document.getElementById('k-c2').textContent=`협상 ${c('협상')}`;
  document.getElementById('k-c3').textContent=`제안 ${c('제안')}`;
}

// ── 상세 패널 ──
function openDetail(d){
  selectedCust=d.고객명; renderMarkers(); panelMode='detail';
  document.getElementById('panel-title').textContent='고객 상세정보';
  document.getElementById('ta-list-btn').classList.remove('active');
  const sc=SC[d.진행현황]||'#adb5bd';
  function row(l,v){return(!v||v==='nan'||v==='None'||v==='0')?'':`<div class="detail-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`;}
  document.getElementById('panel-body').innerHTML=`
    <div style="font-size:16px;font-weight:700;margin-bottom:5px;">${d.고객명}</div>
    <span class="status-badge" style="background:${sc}">${d.진행현황||'미정'}</span>
    <div class="sec-lbl">기본정보</div>
    ${row('관할지사',d.관할지사)}${row('현 택배사',d.현택배사)}${row('집화구분',d.집화구분)}
    ${row('버티컬',d.버티컬)}${row('지역',d.지역)}${row('상세주소',d.상세주소)}
    <hr class="dv"/>
    <div class="sec-lbl">영업정보</div>
    ${row('예상 월 물량',d.예상월물량?(d.예상월물량).toLocaleString()+' 건':'')}
    ${row('월 매출',d.월매출?(d.월매출).toLocaleString()+' 원':'')}
    ${row('평균판가',d.평균판가?(d.평균판가).toLocaleString()+' 원':'')}
    ${row('A타입 판가',d.A타입판가)}
    ${row('계약만료월',d.계약만료월)}${row('수주예정월',d.수주예정월)}${row('키맨',d.키맨성함)}
    ${d.고객니즈?`<hr class="dv"/><div class="sec-lbl">💡 고객 Needs</div><div class="text-box">${d.고객니즈}</div>`:''}
    ${d.영업비고?`<hr class="dv"/><div class="sec-lbl">📝 영업 History</div><div class="text-box">${d.영업비고}</div>`:''}`;
  openPanel();
}

// ── TA 전체현황 ──
function toggleList(){
  if(panelMode==='list'){closePanel();return;}
  panelMode='list'; selectedCust=null; renderMarkers();
  document.getElementById('panel-title').textContent='📋 TA 전체현황';
  document.getElementById('ta-list-btn').classList.add('active');
  renderList(); openPanel();
}
function renderList(){
  let d=[...filteredData];
  if(_ts) d=d.filter(r=>r.고객명.includes(_ts));
  if(_tc) d=d.filter(r=>r.현택배사===_tc);
  if(_tst) d=d.filter(r=>r.진행현황===_tst);
  d.sort((a,b)=>{const va=a[_tsc]||'',vb=b[_tsc]||'';return _tsa?String(va).localeCompare(String(vb),'ko'):String(vb).localeCompare(String(va),'ko');});
  const vol=d.reduce((s,r)=>s+(r.예상월물량||0),0);
  const carriers=[...new Set(filteredData.map(r=>r.현택배사).filter(Boolean))].sort();
  const statuses=['확정','유력','협상','제안','실패'].filter(s=>filteredData.some(r=>r.진행현황===s));
  const cols=[
    {k:'관할지사',l:'지사',w:'50px'},{k:'고객명',l:'고객명',w:'90px'},
    {k:'현택배사',l:'택배사',w:'50px'},{k:'진행현황',l:'현황',w:'46px'},
    {k:'예상월물량',l:'월물량',w:'58px'},{k:'평균판가',l:'평균판가',w:'62px'},
    {k:'버티컬',l:'버티컬',w:'65px'},{k:'집화구분',l:'집화',w:'50px'},
    {k:'키맨성함',l:'키맨',w:'55px'},{k:'계약만료월',l:'계약만료',w:'62px'},
    {k:'수주예정월',l:'수주예정',w:'62px'},{k:'지역',l:'지역',w:'50px'},
    {k:'상세주소',l:'주소',w:'140px'},{k:'고객니즈',l:'Needs',w:'90px'},{k:'영업비고',l:'비고',w:'140px'},
  ];
  document.getElementById('panel-body').innerHTML=`
    <div class="ta-filter-row">
      <input type="text" placeholder="🔍 고객명" value="${_ts}" oninput="_ts=this.value;renderList()" style="width:80px"/>
      <select onchange="_tc=this.value;renderList()">
        <option value="">전체 택배사</option>
        ${carriers.map(c=>`<option value="${c}" ${_tc===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select onchange="_tst=this.value;renderList()">
        <option value="">전체 현황</option>
        ${statuses.map(s=>`<option value="${s}" ${_tst===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="ta-kpi"><span>표시 <b>${d.length}</b>건</span><span>예상물량 <b>${vol.toLocaleString()}</b>건</span></div>
    <div id="ta-tbl-wrap" style="overflow:auto;max-height:calc(100vh - 260px);">
      <table id="ta-tbl"><thead><tr>${cols.map(c=>`<th style="min-width:${c.w}" onclick="taSort('${c.k}')">${c.l}${_tsc===c.k?(_tsa?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
      <tbody>${d.map(r=>{
        const sc2=SC[r.진행현황]||'transparent';
        return `<tr onclick="openDetail(ALL_DATA.find(x=>x.고객명==='${r.고객명.replace(/'/g,"\'")}'))">${cols.map(c=>{
          let v=r[c.k];
          if(c.k==='예상월물량'||c.k==='평균판가') v=v?Number(v).toLocaleString():'';
          if(c.k==='진행현황') return `<td style="background:${sc2}20;color:${sc2};font-weight:600">${v||''}</td>`;
          return `<td title="${String(v||'').replace(/"/g,'&quot;')}">${v||''}</td>`;
        }).join('')}</tr>`;
      }).join('')}</tbody></table>
    </div>
    <button class="dl-btn" onclick="dlExcel()">⬇️ Excel 다운로드</button>`;
}
function taSort(c){if(_tsc===c)_tsa=!_tsa;else{_tsc=c;_tsa=true;}renderList();}

// ── Excel 다운로드 ──
function dlExcel(){
  let d=[...filteredData];
  if(_ts) d=d.filter(r=>r.고객명.includes(_ts));
  if(_tc) d=d.filter(r=>r.현택배사===_tc);
  if(_tst) d=d.filter(r=>r.진행현황===_tst);
  const keys=['관할지사','고객명','집화구분','현택배사','예상월물량','평균판가','A타입판가','버티컬','지역','상세주소','키맨성함','계약만료월','고객니즈','수주예정월','진행현황','영업비고'];
  const hdrs=['관할지사','고객명','집화구분','현 택배사','월물량(건)','평균판가','A타입 판가','버티컬','지역','상세주소','키맨','계약만료월','고객사 Needs','수주 예정월','진행현황','비고'];
  const ws=XLSX.utils.aoa_to_sheet([hdrs,...d.map(r=>keys.map(k=>r[k]))]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'TA현황');
  XLSX.writeFile(wb,`TA현황_${currentBranch||'전체'}_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.xlsx`);
}

// ── 패널 ──
function openPanel(){document.getElementById('right-panel').classList.add('open');setTimeout(()=>map.invalidateSize(),300);}
function closePanel(){
  panelMode='closed';selectedCust=null;
  document.getElementById('right-panel').classList.remove('open');
  document.getElementById('ta-list-btn').classList.remove('active');
  renderMarkers();setTimeout(()=>map.invalidateSize(),300);
}

initBranches();applyFilter();
</script>
</body>
</html>
